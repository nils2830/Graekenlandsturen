<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06182e">
<title>Polis Telefon</title>
<meta name="description" content="Din egen styring til brætspillet Polis: kast terningerne, køb ejendomme og svar på visdomsprøver.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito+Sans:wght@400;700;800&family=Oswald:wght@500;600;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/phone.css">
</head>
<body class="phone">
<header id="top"><span class="logo">ΠΟΛΙΣ</span></header>
<div id="connbar" role="status"></div>
<main id="main">
  <div id="view"></div>
  <div id="diceHost" hidden>
    <div class="dice-stage"><div id="phoneDice"></div></div>
    <div class="dice-sum num" id="diceSum"></div>
  </div>
  <div id="mapHost" hidden><div class="map-box" id="phoneMap"></div></div>
  <div id="view2"></div>
</main>
<nav id="tabs" hidden>
  <button type="button" data-tab="game" class="on">Spil</button>
  <button type="button" data-tab="props">Ejendomme</button>
  <button type="button" data-tab="map">Kort</button>
  <button type="button" data-tab="players">Spillere</button>
</nav>
<div class="toasts" id="toasts"></div>

<script src="vendor/peerjs.min.js"></script>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/data.js"></script>
<script src="js/rules.js"></script>
<script src="js/regionmap.js"></script>
<script src="js/map.js"></script>
<script src="js/net.js"></script>
<script src="js/dice.js"></script>
<script src="js/phone.js"></script>
</body>
</html>
