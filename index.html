<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Polis Brætspil</title>
<meta name="description" content="Familiebrætspil om Nafplio og Athen. Brættet vises på en stor skærm, og hver spiller styrer sin tur fra sin egen telefon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito+Sans:wght@400;700;800&family=Oswald:wght@500;600;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/host.css">
</head>
<body class="host">

<!-- Opsætning -->
<section id="setup" class="screen" hidden></section>

<!-- Lobby: spillerne scanner QR-koden -->
<section id="lobby" class="screen" hidden></section>

<!-- Selve spillet -->
<div id="game" hidden>
  <main id="boardWrap" aria-label="Spillebræt">
    <div id="board">
      <div id="center">
        <div class="pile oracle"><i style="background-image:url(img/sm/pythia.jpg)"></i><span>Oraklets<br>Spådomme</span></div>
        <div class="pile gunst"><i style="background-image:url(img/sm/olympiere.jpg)"></i><span>Gudernes<br>Gunst</span></div>
        <div class="banner"><b>ΠΟΛΙΣ</b><small>Nafplio · Athen</small></div>
        <div id="centerDice"></div>
        <div id="diceInfo" class="num"></div>
        <div id="spot" hidden></div>
      </div>
      <div id="tokens"></div>
    </div>
  </main>

  <aside id="panel">
    <div class="pbox phead">
      <span class="logo">ΠΟΛΙΣ</span>
      <span class="label" id="roundInfo">Runde 1</span>
      <button class="chip-code" id="codeBtn" type="button" title="Vis QR-koden igen">Kode</button>
    </div>
    <section class="pbox" id="turnBox" aria-live="polite">
      <div class="label">Det er turen til</div>
      <div class="turn-who" id="turnWho"></div>
      <div class="prompt-title" id="promptTitle"></div>
      <div class="prompt-opts" id="promptOpts"></div>
      <div class="prompt-note" id="promptNote"></div>
    </section>
    <section class="pbox">
      <div class="label" style="margin-bottom:8px">Spillerne</div>
      <div id="playersBox"></div>
    </section>
    <section class="pbox">
      <div class="label" style="margin-bottom:8px">Seneste nyt</div>
      <div id="feed"></div>
    </section>
    <div class="pfoot">
      <button class="btn small ghost" id="manageBtn" type="button" hidden>Ejendomme (skærm)</button>
      <button class="btn small ghost" id="controlBtn" type="button">Styr fra skærmen: fra</button>
      <button class="btn small ghost" id="mapBtn" type="button">Kort</button>
      <button class="btn small ghost" id="rulesBtn" type="button">Regler</button>
      <button class="btn small ghost" id="newBtn" type="button">Nyt spil</button>
      <a class="btn small ghost" href="kreditering.html" target="_blank" rel="noopener">Billedkreditering</a>
    </div>
  </aside>
</div>

<div id="modal" hidden></div>
<div class="toasts" id="toasts"></div>

<script src="vendor/peerjs.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/data.js"></script>
<script src="js/avatar-icons.js"></script>
<script src="js/avatars.js"></script>
<script src="js/rules.js"></script>
<script src="js/regionmap.js"></script>
<script src="js/map.js"></script>
<script src="js/net.js"></script>
<script src="js/dice.js"></script>
<script src="js/host.js"></script>
</body>
</html>
